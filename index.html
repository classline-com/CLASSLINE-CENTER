<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLASSLINE | مرکز محتوای کلاس‌لاین</title>
<meta name="description" content="مرکز محتوای کلاس‌لاین؛ آرشیو آزمون‌ها و کتاب‌های کمک‌آموزشی">
<meta name="theme-color" content="#050507">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--t6:rgba(255,42,61,.06);--t12:rgba(255,42,61,.12);--t13:rgba(255,42,61,.13);--t32:rgba(255,42,61,.32);--t38:rgba(255,42,61,.38);--t50:rgba(255,42,61,.5);--t65:rgba(255,42,61,.65);--bg:#050507;--red:#ff2a3d;--red2:#a80e20;--line:rgba(255,255,255,.1);--glass:rgba(255,255,255,.05);--text:#f5f2f2;--mut:#a99ea0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%;overflow-x:hidden;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none;-webkit-touch-callout:none}
html{overflow-x:hidden}
input{-webkit-appearance:none;appearance:none;font-size:16px!important}
/* aurora + grid + noise */
.bg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;overflow:hidden;transform:translateZ(0);pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);animation:fl 16s ease-in-out infinite}
.bg i:nth-child(1){width:560px;height:560px;background:#c1121f;opacity:.5;top:-220px;right:-120px}
.bg i:nth-child(2){width:420px;height:420px;background:#4a0610;opacity:.8;bottom:-140px;left:-140px;animation-delay:-6s}
.bg i:nth-child(3){width:260px;height:260px;background:var(--red);opacity:.16;top:40%;left:35%;animation-delay:-10s}
.bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:46px 46px;opacity:.22;-webkit-mask-image:radial-gradient(ellipse at 50% 0,#000 5%,transparent 65%);mask-image:radial-gradient(ellipse at 50% 0,#000 5%,transparent 65%)}
@keyframes fl{50%{transform:translate(50px,36px) scale(1.15)}}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.top img{height:30px;display:block;filter:drop-shadow(0 0 14px rgba(255,42,61,.5))}
.cta{font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:30px;background:var(--red);color:#fff;box-shadow:0 8px 24px -8px var(--red);transition:.2s}
.cta:hover{transform:translateY(-2px)}

/* hero */
.hero{text-align:center;padding:34px 0 26px;position:relative}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:11px;letter-spacing:2.5px;color:#ffd0d5;direction:ltr;border:1px solid rgba(255,42,61,.4);background:rgba(255,42,61,.1);padding:6px 14px;border-radius:30px}
.eyebrow b{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pu 1.8s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(255,42,61,.7)}70%,100%{box-shadow:0 0 0 10px rgba(255,42,61,0)}}
h1{font-size:clamp(34px,8.5vw,68px);font-weight:900;line-height:1.25;margin:20px 0 12px;
   background:linear-gradient(180deg,#fff 30%,#ff8a95 120%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 em{font-style:normal;background:linear-gradient(90deg,#ff2a3d,#ff7a59,#ff2a3d);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.sub{color:var(--mut);font-size:clamp(13px,3.4vw,16px);line-height:2;max-width:560px;margin:0 auto}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}
.stat{padding:10px 18px;border-radius:16px;background:var(--glass);border:1px solid var(--line);}
.stat b{display:block;font-size:22px;color:#fff;font-family:Arial,sans-serif}
.stat span{font-size:11.5px;color:var(--mut)}

/* search + chips */
.bar{position:sticky;top:0;z-index:20;padding:10px 0 12px;margin:0 -18px;padding-left:18px;padding-right:18px;transition:background .25s,box-shadow .25s,border-color .25s;border-bottom:1px solid transparent}
.bar.stuck{background:rgba(8,6,8,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom-color:var(--line);box-shadow:0 14px 30px -18px #000}
.search{position:relative}
.search input{display:block;width:100%;font:inherit;font-size:14.5px;color:var(--text);background:rgba(18,18,24,.8);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;height:52px;padding:0 50px 0 70px;outline:none;transition:.2s}
.search input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(255,42,61,.16)}
.search svg{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:20px;color:#c9bcbf}
.search kbd{position:absolute;left:14px;top:50%;transform:translateY(-50%);font:11px Arial;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:1 1 auto;min-width:0;font:inherit;font-size:13px;font-weight:600;color:var(--mut);background:rgba(255,255,255,.05);border:1px solid var(--line);height:42px;padding:0 18px;border-radius:14px;cursor:pointer;transition:.2s;white-space:nowrap}
.chip:hover{color:#fff;border-color:rgba(255,42,61,.45)}
.chip.on{color:#fff;background:linear-gradient(135deg,#ff2a3d,#c4122a);border-color:transparent;box-shadow:0 8px 22px -8px var(--red)}

/* ticker */
.tick{overflow:hidden;margin:16px 0 4px;border-block:1px solid var(--line);padding:9px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.tick div{display:flex;gap:36px;width:max-content;animation:tk 28s linear infinite;font-size:12px;color:var(--mut);direction:ltr}
.tick span::before{content:"✦ ";color:var(--red)}
@keyframes tk{to{transform:translateX(-50%)}}

/* sections + bento */
.sec{margin:30px 0 12px;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800}
.sec::before{content:"";width:9px;height:9px;transform:rotate(45deg);background:var(--red);box-shadow:0 0 12px var(--red)}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(to left,var(--line),transparent)}
.sec{flex-wrap:wrap;row-gap:2px}
.sec small{order:3;flex-basis:100%;padding-right:19px;font-weight:400;color:var(--mut);font-size:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card{--t:#ff2a3d;position:relative;display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:24px;overflow:hidden;cursor:pointer;
  background:linear-gradient(160deg,var(--t13),var(--glass) 55%);border:1px solid var(--line);
  transition:transform .25s,border-color .25s,box-shadow .25s;
  animation:in .6s both}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(280px circle at var(--mx,50%) var(--my,0),var(--t38),transparent 60%);opacity:0;transition:.3s}
.card:hover{transform:translateY(-5px);border-color:var(--t65);box-shadow:0 22px 44px -18px var(--t)}
.card:hover::before{opacity:1}
.card.big{grid-column:1/-1;flex-direction:row;align-items:center;gap:18px;padding:22px}
.ico{position:relative;flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:var(--t);
  background:linear-gradient(145deg,var(--t32),var(--t6));border:1px solid var(--t50);
  box-shadow:0 0 26px -6px var(--t),inset 0 1px 0 rgba(255,255,255,.14);transition:transform .3s}
.card.big .ico{width:72px;height:72px;border-radius:22px}
.ico svg{width:28px;height:28px;filter:drop-shadow(0 0 7px var(--t))}
.card.big .ico svg{width:34px;height:34px}
.card:hover .ico{transform:scale(1.1) rotate(-5deg)}
.meta{position:relative;flex:1;min-width:0}
.meta h3{font-size:15.5px;line-height:1.7;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta p{font-size:12.6px;color:var(--mut);line-height:1.9;margin-top:4px}
.tag{font-size:10px;font-weight:700;color:#fff;background:var(--t);padding:2px 9px;border-radius:20px}
.open{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--t);margin-top:auto}
.open svg{width:15px;transition:transform .25s}
.card:hover .open svg{transform:translateX(-5px)}
.card.big .open{margin:0;flex:none;padding:10px 18px;border-radius:30px;border:1px solid var(--t50);background:var(--t12)}
.empty{display:none;text-align:center;padding:60px 20px;color:var(--mut)}
.empty b{display:block;font-size:34px;margin-bottom:6px;color:var(--red)}

/* about */
.about{margin-top:34px;padding:22px;border-radius:24px;border:1px solid var(--line);background:var(--glass);display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.about p{font-size:13px;color:var(--mut);line-height:2;flex:1;min-width:220px}
.about p b{color:#fff}
footer{text-align:center;color:#7f7477;font-size:12px;padding:30px 0 10px;letter-spacing:.5px}

/* dock (mini-app) */
.dock{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:4px;padding:7px;border-radius:26px;
  background:rgba(16,16,22,.78);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 20px 50px -10px #000}
.dock a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mut);padding:9px 20px;border-radius:20px;transition:.2s}
.dock a svg{width:21px}
.dock a.on,.dock a:hover{color:#fff;background:rgba(255,42,61,.18)}
.dock a.on svg{color:var(--red);filter:drop-shadow(0 0 6px var(--red))}
@media(max-width:560px){.card.big{flex-direction:column;align-items:flex-start}.card.big .open{align-self:stretch;justify-content:center}.top .cta{display:none}.search kbd{display:none}.search input{padding-left:16px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div class="wrap">

    <a href="https://t.me/CLASSLINE_COM" data-ext><img src="assets/logo.png" alt="لوگوی کلاس‌لاین" onerror="this.onerror=null;this.src='assets/classline-logo.webp'"></a>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="جستجو: ماز، قلم‌چی، خیلی سبز، QB …" autocomplete="off"><kbd>/</kbd>

</div>

<nav class="dock">

  <a href="#" id="dSearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>جستجو</a>
  <a href="https://t.me/CLASSLINE_COM" data-ext><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 4.5L2.8 11.6c-.8.3-.8 1.3 0 1.6l4.7 1.6 1.8 5.5c.2.6 1 .8 1.4.3l2.6-2.5 4.7 3.5c.6.4 1.4.1 1.6-.6l3-14.4c.2-.9-.7-1.6-1.1-1.1z"/></svg>کانال</a>
</nav>

<script src="./data.js"></script>
<script>
var D = window.CLASSLINE_DATA || {sections:[]};
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  try{ tg.ready(); }catch(e){}
  try{ tg.expand(); }catch(e){}
  try{ tg.setHeaderColor("#050507"); }catch(e){}
  try{ tg.setBackgroundColor("#050507"); }catch(e){}
  try{ tg.setBottomBarColor && tg.setBottomBarColor("#050507"); }catch(e){}
  try{ tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }catch(e){}
}
function tints(hex){
  var m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex||""); if(!m) return "";
  var r=parseInt(m[1],16),g=parseInt(m[2],16),b=parseInt(m[3],16),o="--t:"+hex+";";
  [6,12,13,32,38,50,65].forEach(function(n){o+="--t"+n+":rgba("+r+","+g+","+b+","+(n/100)+");"});
  return o;
}
function go(u){
  try{
    if (tg && /^https?:\/\/(t|telegram)\.me\//i.test(u) && tg.openTelegramLink) return tg.openTelegramLink(u);
    if (tg && tg.openLink && !/^https?:\/\/classline-com\.github\.io/i.test(u)) return tg.openLink(u);
  }catch(e){}
  window.open(u, "_blank");
}
function en(s){return String(s==null?"":s).replace(/[\u06F0-\u06F9]/g,function(c){return c.charCodeAt(0)-1776}).replace(/[\u0660-\u0669]/g,function(c){return c.charCodeAt(0)-1632})}
function esc(s){return en(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

// آیکن‌ها: فیلد اختیاری icon در هر آیتم (exam, pack, book, qb, flask, planner, maker, link)
var I = {
 exam:'<path d="M9 3h6a1 1 0 0 1 1 1v1h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2V4a1 1 0 0 1 1-1z"/><path d="M8 5h8M8.5 13l2.2 2.2L15.5 10.5"/>',
 pack:'<path d="M12 3l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5L12 21l9-4.5"/>',
 book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h7M9 12h5"/>',
 qb:'<rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1.9-1.1 1.6"/><path d="M12 16.6v.1"/>',
 flask:'<path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9V3"/><path d="M7.5 15h9"/>',
 planner:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/><path d="M8 14.5l1.8 1.8L13 13"/>',
 maker:'<path d="M14 3l7 7-11 11H3v-7z"/><path d="M12 5l7 7"/>',
 link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/>'
};
// رنگ و آیکن خودکار بر اساس نام مؤسسه/بخش؛ با فیلدهای icon و tint در data.js قابل تغییر است
function look(sec,it){
  var s=(it.title+" "+(it.tag||"")).replace(/[\u200c]/g,"");
  var t="#ff2a3d";
  if(/قلمچی/.test(s)) t="#3b9bff"; else if(/خیلیسبز|خیلی سبز/.test(s)) t="#22c55e"; else if(/ماز/.test(s)) t="#ff2a3d"; else if(/گاج/.test(s)) t="#f59e0b";
  var ic = sec.id==="exams" ? "exam" : sec.id==="books" ? "pack" : "link";
  return {icon:it.icon||ic, t:it.tint||t};
}

var cur="all", q=document.getElementById("q"), app=document.getElementById("app"), empty=document.getElementById("empty");
var secs=D.sections||[];
var total=0; secs.forEach(function(s){total+=(s.items||[]).length});

document.getElementById("title").innerHTML=esc(D.title||"مرکز محتوای کلاس‌لاین").replace("کلاس‌لاین","<em>کلاس‌لاین</em>");
document.getElementById("subtitle").textContent=en(D.subtitle||"");
document.getElementById("foot").textContent=en(D.footerNote||"");
if(D.signature) document.getElementById("sig").innerHTML=esc(D.signature).replace(/\n/g,"<br>")+'<br><span style="opacity:.6">CLASSLINE</span>';
document.getElementById("stats").innerHTML=secs.map(function(s){return '<div class="stat"><b>'+(s.items||[]).length+'</b><span>'+esc(s.title)+'</span></div>'}).join("")
  +(D.updated?'<div class="stat"><b style="font-size:17px;padding-top:4px;display:block">'+esc(D.updated)+'</b><span>سال تحصیلی</span></div>':'');
document.getElementById("chips").innerHTML='<button class="chip on" data-c="all">همه</button>'+secs.map(function(s){return '<button class="chip" data-c="'+esc(s.id)+'">'+esc(s.title)+'</button>'}).join("");
var tk=""; secs.forEach(function(s){(s.items||[]).forEach(function(it){tk+="<span>"+esc(it.title)+"</span>"})});
document.getElementById("tick").innerHTML=tk+tk;

function render(){
  var f=q.value.trim().toLocaleLowerCase("fa"),h="",n=0,any=false;
  secs.forEach(function(s){
    if(cur!=="all"&&s.id!==cur)return;
    var items=(s.items||[]).filter(function(it){return !f||(s.title+" "+it.title+" "+(it.description||"")+" "+(it.tag||"")).toLocaleLowerCase("fa").indexOf(f)>-1});
    if(!items.length)return; any=true;
    h+='<div class="sec"><span>'+esc(s.title)+'</span>'+(s.description?'<small>'+esc(s.description)+'</small>':'')+'</div><div class="grid">';
    items.forEach(function(it,i){
      var L=look(s,it);
      h+='<a class="card'+(i===0&&items.length>2&&!it.noBig?' big':'')+'" style="'+tints(L.t)+'animation-delay:'+(n++*70)+'ms" data-u="'+esc(it.url)+'" href="'+esc(it.url)+'">'+
        '<div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(I[L.icon]||I.link)+'</svg></div>'+
        '<div class="meta"><h3>'+esc(it.title)+(it.tag?'<span class="tag">'+esc(it.tag)+'</span>':'')+'</h3><p>'+esc(it.description||"")+'</p></div>'+
        '<span class="open">مشاهده<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span></a>';
    });
    h+="</div>";
  });
  app.innerHTML=h; empty.style.display=any?"none":"block";
}
document.getElementById("chips").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;cur=b.dataset.c;
  [].forEach.call(this.children,function(c){c.classList.toggle("on",c===b)});render()};
q.oninput=render;
app.addEventListener("click",function(e){var a=e.target.closest(".card");if(!a)return;e.preventDefault();go(a.dataset.u)});
app.addEventListener("pointermove",function(e){var a=e.target.closest(".card");if(!a)return;var r=a.getBoundingClientRect();
  a.style.setProperty("--mx",(e.clientX-r.left)+"px");a.style.setProperty("--my",(e.clientY-r.top)+"px")});
document.querySelectorAll("[data-ext]").forEach(function(a){a.onclick=function(e){e.preventDefault();go(a.href)}});
